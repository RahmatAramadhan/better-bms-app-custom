name: Build and Deploy to Github Pages
on:
  push:
    branches:
      - main # deployed to /better-bms-app-custom/
      - v2 # deployed to /better-bms-app-custom/v2/
permissions:
  contents: write
jobs:
  build-and-deploy:
    # One shared group so main and v2 deployments never push to gh-pages at the same time
    concurrency: gh-pages-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Install and Build 🔧
        run: |
          yarn install --frozen-lockfile
          CI=false yarn build
        env:
          PUBLIC_URL: ${{ github.ref_name == 'v2' && '/better-bms-app-custom/v2' || '/better-bms-app-custom' }}

      - name: Deploy main 🚀
        if: github.ref_name == 'main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          # Keep the v2 build when main redeploys the root
          clean-exclude: v2

      - name: Deploy v2 🚀
        if: github.ref_name == 'v2'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          target-folder: v2
